    <style>
        :root {
            --color-text: #f1f5f9;
            --color-text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: var(--color-text);
            background: radial-gradient(ellipse at 30% 20%, #030712 0%, #0a0f1a 20%, #0f172a 40%, #1e1b4b 60%, #1a1544 75%, #0a0f1a 88%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        *:focus-visible {
            outline: 2px solid rgba(99, 102, 241, 0.6);
            outline-offset: 3px;
            border-radius: 8px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0, 0, 0, 0.03) 1px, rgba(0, 0, 0, 0.03) 2px),
                repeating-linear-gradient(90deg, transparent, transparent 1px, rgba(0, 0, 0, 0.03) 1px, rgba(0, 0, 0, 0.03) 2px);
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        main {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 32px;
        }

        h1 {
            font-weight: 200;
            font-size: clamp(2.25rem, 6vw, 4rem);
            letter-spacing: -0.02em;
            margin: 0;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 35%, #c7d2fe 60%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            height: 1px;
            width: 48px;
            margin: 20px auto;
            background: linear-gradient(to right, transparent, rgba(99, 102, 241, 0.6), transparent);
        }

        p.tagline {
            font-weight: 300;
            font-size: clamp(0.8rem, 2vw, 1rem);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin: 0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .sr-only:focus {
            position: fixed;
            top: 1rem;
            left: 1rem;
            width: auto;
            height: auto;
            padding: 0.5rem 1rem;
            margin: 0;
            overflow: visible;
            clip: auto;
            white-space: normal;
            background: #4338ca;
            color: #fff;
            border-radius: 6px;
            z-index: 50;
        }
    </style>
</head>

<body data-theme="light">
    <a href="#main-content"

    </main>

        AOS.init({
            once: true,
            disable: () => window.matchMedia('(prefers-reduced-motion: reduce)').matches
        });
    </script>
</body>
